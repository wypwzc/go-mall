syntax = "proto3";

package stock;
option go_package = "github.com/wypwzc/go-mall/apps/stock/pb;stockpb";

message GetStockRequest {
  int64 product_id = 1;
}

message Stock {
  int64 product_id = 1;
  int64 available = 2;
}

message ReserveStockRequest {
  string order_id = 1;
  int64 product_id = 2;
  int64 quantity = 3;
}

message ReleaseStockRequest {
  string order_id = 1;
}

message Reservation {
  string order_id = 1;
  bool reserved = 2;
}

service StockService {
  rpc GetStock(GetStockRequest) returns (Stock);
  rpc ReserveStock(ReserveStockRequest) returns (Reservation);
  rpc ReleaseStock(ReleaseStockRequest) returns (Reservation);
}

syntax = "proto3";

package order;
option go_package = "github.com/wypwzc/go-mall/apps/order/pb;orderpb";

message Order {
  string id = 1;
  int64 user_id = 2;
  int64 product_id = 3;
  string product_name = 4;
  int64 unit_price_cents = 5;
  int64 quantity = 6;
  int64 total_cents = 7;
  string status = 8;
  int64 created_at_unix = 9;
}

message CreateOrderRequest {
  int64 user_id = 1;
  int64 product_id = 2;
  int64 quantity = 3;
}

message ListOrdersRequest {
  int64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListOrdersResponse {
  repeated Order items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
}

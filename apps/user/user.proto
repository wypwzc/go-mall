syntax = "proto3";

package user;
option go_package = "github.com/wypwzc/go-mall/apps/user/pb;userpb";

message User {
  int64 id = 1;
  string username = 2;
  string display_name = 3;
  int64 created_at_unix = 4;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string display_name = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message GetUserRequest {
  int64 user_id = 1;
}

service UserService {
  rpc Register(RegisterRequest) returns (User);
  rpc Login(LoginRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
}
